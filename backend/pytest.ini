[pytest]
# Pytest configuration for Ross backend
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Add backend to Python path
pythonpath = .

# Output options
addopts = -v --tb=short --strict-markers

# Markers for organizing tests
markers =
    auth: Authentication and authorization tests
    ownership: Ownership scoping tests
    encryption: Encryption tests
    integration: Integration tests
    connector: Connector tests
    webhook: Webhook end-to-end tests
    slow: Slow tests
    db: Requires a live test database (docker compose up test-db)
