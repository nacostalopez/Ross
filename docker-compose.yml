# Fixed project name so containers are ross-* whatever the checkout folder is called.
name: ross

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ross}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ross}
      POSTGRES_DB: ${POSTGRES_DB:-ross}
    ports:
      - "5432:5432"
    volumes:
      - ross_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ross}"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ross_test
    ports:
      - "5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ross}:${POSTGRES_PASSWORD:-ross}@db:5432/${POSTGRES_DB:-ross}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-Qxsu0Kb675R0dWY-WeAE-1hvcXLTQj74_pJrlsr_kG4=}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3100}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-ross@aramal.co}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_CLAIM_EMAIL: ${VAPID_CLAIM_EMAIL:-ross@aramal.co}
      # Connector OAuth credentials — each *_ID/*_SECRET/*_TOKEN defaults to
      # empty (same as its connector's own Python default), so leaving them
      # unset in .env changes nothing; setting a real value here is what
      # actually lets a real "Conectar" flow complete. Fallbacks for
      # *_REDIRECT_URI/*_SCOPES mirror the matching connector's own default
      # exactly, so they're safe no-ops too when left unset in .env.
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
      SHOPIFY_REDIRECT_URI: ${SHOPIFY_REDIRECT_URI:-http://localhost:3100/index.html?connector=shopify}
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES:-read_orders,write_orders,read_products,write_products}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-http://localhost:3100/index.html?connector=meta}
      META_SCOPES: ${META_SCOPES:-ads_management,ads_read}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3100/index.html?connector=google}
      GOOGLE_SCOPES: ${GOOGLE_SCOPES:-https://www.googleapis.com/auth/adwords}
      GOOGLE_DEVELOPER_TOKEN: ${GOOGLE_DEVELOPER_TOKEN:-}
      TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-http://localhost:3100/index.html?connector=tiktok}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-http://localhost:3100/index.html?connector=linkedin}
      LINKEDIN_SCOPES: ${LINKEDIN_SCOPES:-r_ads,r_ads_reporting}
      TIENDANUBE_CLIENT_ID: ${TIENDANUBE_CLIENT_ID:-}
      TIENDANUBE_CLIENT_SECRET: ${TIENDANUBE_CLIENT_SECRET:-}
      TIENDANUBE_REDIRECT_URI: ${TIENDANUBE_REDIRECT_URI:-http://localhost:3100/auth/tiendanube/callback}
      TIENDANUBE_SCOPES: ${TIENDANUBE_SCOPES:-read_orders,read_products}
      MERCADOPAGO_CLIENT_ID: ${MERCADOPAGO_CLIENT_ID:-}
      MERCADOPAGO_CLIENT_SECRET: ${MERCADOPAGO_CLIENT_SECRET:-}
      MERCADOPAGO_REDIRECT_URI: ${MERCADOPAGO_REDIRECT_URI:-http://localhost:3100/index.html?connector=mercadopago}
      MERCADOPAGO_SCOPES: ${MERCADOPAGO_SCOPES:-offline_access read write}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOLIBRE_CLIENT_ID: ${MERCADOLIBRE_CLIENT_ID:-}
      MERCADOLIBRE_CLIENT_SECRET: ${MERCADOLIBRE_CLIENT_SECRET:-}
      MERCADOLIBRE_REDIRECT_URI: ${MERCADOLIBRE_REDIRECT_URI:-http://localhost:3100/index.html?connector=mercadolibre}
      MERCADOLIBRE_AUTH_DOMAIN: ${MERCADOLIBRE_AUTH_DOMAIN:-auth.mercadolibre.com.ar}
      MERCADOPAGO_BILLING_ACCESS_TOKEN: ${MERCADOPAGO_BILLING_ACCESS_TOKEN:-}
      MERCADOPAGO_BILLING_WEBHOOK_SECRET: ${MERCADOPAGO_BILLING_WEBHOOK_SECRET:-}
      BILLING_CURRENCY: ${BILLING_CURRENCY:-ARS}
    ports:
      - "${API_PORT:-8100}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3100}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  # Explicit name: without it Compose would prefix the project name (ross_ross_db_data).
  # Created on 2026-09-24 as a copy of the old escal_escal_db_data volume, kept as a backup.
  ross_db_data:
    name: ross_db_data
