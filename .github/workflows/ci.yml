name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ross_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5433/ross_test
      TEST_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5433/ross_test
      JWT_SECRET: ci-test-secret
      CREDENTIALS_ENCRYPTION_KEY: Qxsu0Kb675R0dWY-WeAE-1hvcXLTQj74_pJrlsr_kG4=

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Check no real .env is committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A real .env file is tracked in git — only .env.example should ever be committed."
            exit 1
          fi

      - name: Validate required environment variables are set
        run: python scripts/check_env.py

      - name: Apply database schema (db/init/*.sql)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in db/init/*.sql; do
            echo "Applying $f"
            PGPASSWORD=test psql -h localhost -p 5433 -U test -d ross_test -f "$f"
          done

      - name: Validate connector implementations match BaseConnector
        working-directory: backend
        run: pytest tests/test_connectors_interface.py -v

      - name: Run offline tests (no database)
        working-directory: backend
        run: pytest -m "not db"

      - name: Run database tests (test DB)
        working-directory: backend
        run: pytest -m db

  accessibility:
    # The landing, pricing, login and dashboard (with demo data, light and dark)
    # at 1280 and 390 px: no serious/critical axe violation, no horizontal
    # scroll, no console errors. See e2e/accessibility.js.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: ross
          POSTGRES_PASSWORD: ross
          POSTGRES_DB: ross
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ross"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://ross:ross@localhost:5432/ross
      JWT_SECRET: ci-test-secret
      CREDENTIALS_ENCRYPTION_KEY: Qxsu0Kb675R0dWY-WeAE-1hvcXLTQj74_pJrlsr_kG4=

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply database schema (db/init/*.sql)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in db/init/*.sql; do
            echo "Applying $f"
            psql postgresql://ross:ross@localhost:5432/ross -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Start the API and serve the frontend
        run: |
          (cd backend && nohup uvicorn app.main:app --host 127.0.0.1 --port 8100 > ../uvicorn.log 2>&1 &)
          nohup python -m http.server 3100 --bind 127.0.0.1 --directory frontend > static.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8100/health > /dev/null && curl -fsS http://127.0.0.1:3100/landing.html > /dev/null; then
              echo "API and frontend are up"
              exit 0
            fi
            sleep 1
          done
          echo "API or frontend did not come up in 30s"
          cat uvicorn.log static.log
          exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run accessibility checks
        working-directory: e2e
        env:
          FRONTEND_URL: http://127.0.0.1:3100
        run: npm run test:a11y

      - name: Show API server log
        if: failure()
        run: cat uvicorn.log || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-screenshots
          path: e2e/shots/
          if-no-files-found: ignore
