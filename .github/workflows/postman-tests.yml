name: Ross API - Postman Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  postman-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: escal
          POSTGRES_PASSWORD: escal
          POSTGRES_DB: escal
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install Python dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    
    - name: Initialize database
      env:
        DATABASE_URL: postgresql+psycopg2://escal:escal@localhost:5432/escal
      run: |
        cd backend
        # Run migrations/init scripts if needed
        psql postgresql://escal:escal@localhost:5432/escal < ../db/init/001_extensions.sql
        psql postgresql://escal:escal@localhost:5432/escal < ../db/init/002_relational_tables.sql
        psql postgresql://escal:escal@localhost:5432/escal < ../db/init/003_hypertables.sql
        psql postgresql://escal:escal@localhost:5432/escal < ../db/init/004_continuous_aggregates.sql
        psql postgresql://escal:escal@localhost:5432/escal < ../db/init/005_users.sql
    
    - name: Start API server
      env:
        DATABASE_URL: postgresql+psycopg2://escal:escal@localhost:5432/escal
        JWT_SECRET: test-secret-key
        CREDENTIALS_ENCRYPTION_KEY: Qxsu0Kb675R0dWY-WeAE-1hvcXLTQj74_pJrlsr_kG4=
      run: |
        cd backend
        uvicorn app.main:app --host 127.0.0.1 --port 8100 &
        sleep 3  # Wait for server to start
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install Newman
      run: npm install -g newman
    
    - name: Run Postman tests
      run: |
        newman run Ross-API-Tests.postman_collection.json \
          -e Ross-Env-Local.postman_environment.json \
          --reporters cli,json,html \
          --reporter-json-export test-results.json \
          --reporter-html-export test-results.html \
          --bail
      continue-on-error: false
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: postman-test-results
        path: |
          test-results.json
          test-results.html
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
          
          const run = results.run;
          const stats = run.stats;
          const passed = stats.tests.total - stats.tests.failed;
          const failed = stats.tests.failed;
          
          const comment = `
          ## 📊 Postman API Tests
          
          | Metric | Value |
          |--------|-------|
          | Passed | ✅ ${passed} |
          | Failed | ${failed > 0 ? '❌ ' + failed : '✅ 0'} |
          | Total | ${stats.tests.total} |
          | Assertions | ${stats.assertions.total} |
          
          **Duration:** ${(run.timings.completed / 1000).toFixed(2)}s
          
          [View detailed results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    
    - name: Generate summary
      if: always()
      run: |
        echo "## API Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f test-results.json ]; then
          python3 << EOF
        import json
        with open('test-results.json') as f:
            data = json.load(f)
            stats = data['run']['stats']
            print(f"- **Tests:** {stats['tests']['total']}")
            print(f"- **Passed:** {stats['tests']['total'] - stats['tests']['failed']}")
            print(f"- **Failed:** {stats['tests']['failed']}")
            print(f"- **Assertions:** {stats['assertions']['total']}")
        EOF
        fi
