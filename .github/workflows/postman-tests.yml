name: Ross API - Postman Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  postman-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # "Comment PR with results"

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: ross
          POSTGRES_PASSWORD: ross
          POSTGRES_DB: ross
        options: >-
          --health-cmd "pg_isready -U ross"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+psycopg2://ross:ross@localhost:5432/ross
      JWT_SECRET: test-secret-key
      CREDENTIALS_ENCRYPTION_KEY: Qxsu0Kb675R0dWY-WeAE-1hvcXLTQj74_pJrlsr_kG4=

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Same version as backend/Dockerfile, ci.yml and ruff's target-version.
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install Python dependencies
      working-directory: backend
      run: pip install -r requirements.txt

    - name: Apply database schema (db/init/*.sql)
      # Every script, in order — the same set docker-compose's db service
      # runs from /docker-entrypoint-initdb.d. ON_ERROR_STOP so a broken
      # script fails here instead of as a confusing 500 in newman.
      run: |
        sudo apt-get update && sudo apt-get install -y postgresql-client
        for f in db/init/*.sql; do
          echo "Applying $f"
          psql postgresql://ross:ross@localhost:5432/ross -v ON_ERROR_STOP=1 -f "$f"
        done

    - name: Start API server
      working-directory: backend
      run: |
        nohup uvicorn app.main:app --host 127.0.0.1 --port 8100 > ../uvicorn.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8100/health > /dev/null; then
            echo "API is up"
            exit 0
          fi
          sleep 1
        done
        echo "API did not become healthy in 30s"
        cat ../uvicorn.log
        exit 1

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Newman
      run: npm install -g newman newman-reporter-html

    - name: Run Postman tests
      run: |
        newman run Ross-API-Tests.postman_collection.json \
          -e Ross-Env-Local.postman_environment.json \
          --reporters cli,json,html \
          --reporter-json-export test-results.json \
          --reporter-html-export test-results.html \
          --bail

    - name: Show API server log
      if: failure()
      run: cat uvicorn.log || true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: postman-test-results
        path: |
          test-results.json
          test-results.html
          uvicorn.log
        if-no-files-found: ignore

    - name: Comment PR with results
      # Fork PRs get a read-only token, so skip rather than fail there.
      if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('test-results.json') != ''
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
          
          const run = results.run;
          const stats = run.stats;
          const passed = stats.tests.total - stats.tests.failed;
          const failed = stats.tests.failed;
          
          const comment = `
          ## 📊 Postman API Tests
          
          | Metric | Value |
          |--------|-------|
          | Passed | ✅ ${passed} |
          | Failed | ${failed > 0 ? '❌ ' + failed : '✅ 0'} |
          | Total | ${stats.tests.total} |
          | Assertions | ${stats.assertions.total} |
          
          **Duration:** ${(run.timings.completed / 1000).toFixed(2)}s
          
          [View detailed results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    
    - name: Generate summary
      if: always()
      run: |
        echo "## API Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f test-results.json ]; then
          python3 << EOF
        import json
        with open('test-results.json') as f:
            data = json.load(f)
            stats = data['run']['stats']
            print(f"- **Tests:** {stats['tests']['total']}")
            print(f"- **Passed:** {stats['tests']['total'] - stats['tests']['failed']}")
            print(f"- **Failed:** {stats['tests']['failed']}")
            print(f"- **Assertions:** {stats['assertions']['total']}")
        EOF
        fi
